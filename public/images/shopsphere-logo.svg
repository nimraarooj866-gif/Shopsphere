<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle lines -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="400" cy="400" r="370" fill="none" stroke="#ffffff" stroke-width="6"/>
  
  <!-- Eucalyptus leaves - top left -->
  <g id="leaves-top">
    <ellipse cx="200" cy="150" rx="25" ry="50" fill="#6FA89F" opacity="0.7" transform="rotate(-40 200 150)"/>
    <ellipse cx="180" cy="180" rx="20" ry="45" fill="#7FB3A8" opacity="0.8" transform="rotate(-20 180 180)"/>
    <ellipse cx="220" cy="170" rx="22" ry="48" fill="#6FA89F" opacity="0.75" transform="rotate(-60 220 170)"/>
    <ellipse cx="190" cy="210" rx="18" ry="42" fill="#7FB3A8" opacity="0.7" transform="rotate(10 190 210)"/>
  </g>
  
  <!-- Eucalyptus leaves - bottom right -->
  <g id="leaves-bottom">
    <ellipse cx="600" cy="650" rx="25" ry="50" fill="#6FA89F" opacity="0.7" transform="rotate(140 600 650)"/>
    <ellipse cx="620" cy="620" rx="20" ry="45" fill="#7FB3A8" opacity="0.8" transform="rotate(160 620 620)"/>
    <ellipse cx="560" cy="630" rx="22" ry="48" fill="#6FA89F" opacity="0.75" transform="rotate(120 560 630)"/>
    <ellipse cx="610" cy="590" rx="18" ry="42" fill="#7FB3A8" opacity="0.7" transform="rotate(190 610 590)"/>
  </g>
  
  <!-- Main text: Shopsphere (elegant script-like font) -->
  <text x="400" y="380" font-family="cursive" font-size="140" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="2">Shopsphere</text>
  
  <!-- Subtitle: BEAUTY AND SKINCARE -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="48" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="8">BEAUTY AND</text>
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="48" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="8">SKINCARE</text>
</svg>
