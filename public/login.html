<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shopsphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css" />
  <style>
    header {
      width: 100%;
      background: linear-gradient(135deg, #C84771, #a83a5a);
      padding: 12px 20px;
      box-shadow: 
        0 8px 16px rgba(200, 71, 113, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      border: none;
      border-radius: 0 0 20px 20px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .header-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
    }
    .header-brand {
      font-size: 18px;
      color: #fff;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    .inner h1 {
      font-size: 30px;
      color: #fff;
      margin: 0 0 4px 0;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 2px;
    }
    .inner nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      opacity: 0.9;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner nav a:hover {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header role="banner">
    <div class="header-left">
      <img src="images/shopsphere-logo.svg" alt="Shopsphere Beauty and Skincare Logo" class="header-logo" style="width:60px; height:auto;">
    </div>
    <div class="inner">
      <h1>Beauty and Skincare</h1>
      <nav role="navigation" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-box">
      <h2>Login</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </form>
      <p class="small-text">
        Don't have an account? <a href="signup.html">Signup here</a>
      </p>
    </section>
  </main>

  <!-- Chatbot icon -->
  <style>
    .chatbot-icon { 
      position: fixed; 
      right: 20px; 
      bottom: 20px; 
      width:56px; 
      height:56px; 
      border-radius:50%; 
      background: #E8F0F4;
      display:flex; 
      align-items:center; 
      justify-content:center; 
      color:#C84771; 
      font-size:22px; 
      box-shadow:8px 8px 16px #d4738f, -8px -8px 16px #ffffff; 
      cursor:pointer; 
      z-index:120; 
      transition:all 0.3s ease;
      border: 2px solid #C84771;
    }
    .chatbot-icon:hover { background: #D6E9F5; }
    .chatbot-icon:active { transform:scale(0.96); box-shadow:inset 6px 6px 12px #d4738f, inset -6px -6px 12px #ffffff; }
    
    .chat-window {
      position: fixed;
      right: 92px;
      bottom: 22px;
      width: 320px;
      background: #E8F0F4;
      border-radius: 20px;
      box-shadow: 12px 12px 24px #d4738f, -12px -12px 24px #ffffff;
      overflow: hidden;
      display: none;
      z-index: 120;
      flex-direction: column;
      border: 2px solid #C84771;
    }
    .chat-window.active { display: flex; }
    .chat-window header {
      padding: 12px 14px;
      background: #C84771;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .chat-window .messages {
      padding: 12px;
      max-height: 240px;
      overflow-y: auto;
      background: #E8F0F4;
      flex: 1;
    }
    .chat-window .chat-input {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
      background: #E8F0F4;
    }
    .chat-window input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #E8F0F4;
      box-shadow: inset 4px 4px 8px #d4738f, inset -4px -4px 8px #ffffff;
      color: #1a1a1a;
      font-family: 'Poppins', sans-serif;
    }
    .chat-window button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #C84771;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.3s ease;
    }
    .chat-window button:hover { background: #a83a5a; }
    .chat-window button:active { box-shadow: none; }
    .close-chat {
      background: transparent;
      border: 0;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
  </style>

  <div class="chatbot-icon" id="chatbotToggle" role="button" aria-label="Open chat" title="Chat with us">💬</div>
  
  <div class="chat-window" id="chatWindow">
    <header>
      <span>Beauty Bot</span>
      <button class="close-chat" id="closeChat" aria-label="Close chat">✕</button>
    </header>
    <div class="messages" id="chatMessages">
      <div style="background:#fff;padding:10px;border-radius:10px;display:inline-block;max-width:80%;box-shadow:0 2px 8px rgba(0,0,0,0.08);">Hi! Need help with your account?</div>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Type a message..." aria-label="Type a message">
      <button id="chatSend">Send</button>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById("login-form");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      try {
        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          alert(data.message);
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "products.html";
        } else {
          const err = await res.json();
          alert(err.message);
        }
      } catch (err) {
        alert("Error during login");
      }
    });

    // Chatbot UI
    const chatToggle = document.getElementById('chatbotToggle');
    const chatWindow = document.getElementById('chatWindow');
    const closeChat = document.getElementById('closeChat');
    const chatSend = document.getElementById('chatSend');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');

    chatToggle.addEventListener('click', () => {
      chatWindow.classList.toggle('active');
    });
    closeChat.addEventListener('click', () => chatWindow.classList.remove('active'));

    function sendMessage() {
      const v = chatInput.value.trim();
      if (!v) return;
      const userMsg = document.createElement('div');
      userMsg.style.cssText = 'background:#C84771;color:#fff;padding:8px 12px;border-radius:12px;display:inline-block;max-width:80%;margin:8px 0;';
      userMsg.textContent = v;
      chatMessages.appendChild(userMsg);
      chatInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
      setTimeout(() => {
        const bot = document.createElement('div');
        bot.style.cssText = 'background:#fff;padding:10px;border-radius:10px;display:inline-block;max-width:80%;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin:8px 0;';
        bot.textContent = 'Thanks! We will get back to you shortly.';
        chatMessages.appendChild(bot);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 700);
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
  <script src="script.js"></script>
</body>
</html>
