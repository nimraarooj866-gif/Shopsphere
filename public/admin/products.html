<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --primary-dark: #0a0f1f;
      --secondary-dark: #0f1729;
      --card-dark: #1a2847;
      --accent: #E91E8C;
      --accent-light: #FF4DB8;
      --text-primary: #f1f5fb;
      --text-secondary: #b0b9c8;
      --text-muted: #8a92a1;
      --border: rgba(224, 230, 242, 0.1);
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --spacing-2xl: 28px;
      --spacing-3xl: 36px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto;
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--primary-dark) 0%, #0d1425 50%, #0a0f1f 100%);
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
      background: var(--primary-dark);
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background: linear-gradient(180deg, rgba(15, 23, 41, 0.95) 0%, rgba(10, 15, 31, 0.98) 100%);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border);
      padding: var(--spacing-xl) var(--spacing-lg);
      overflow-y: auto;
      z-index: 100;
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.3);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(224, 230, 242, 0.1);
      border-radius: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(224, 230, 242, 0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-2xl);
      padding-bottom: var(--spacing-xl);
      border-bottom: 1px solid var(--border);
    }

    .logo img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
    }

    .logo h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-light) 100%);
      border-radius: 0 3px 3px 0;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav a:hover {
      color: var(--text-primary);
      background: rgba(233, 30, 140, 0.08);
      border-color: rgba(233, 30, 140, 0.15);
    }

    .nav a:hover::before {
      height: 24px;
    }

    .nav a.active {
      color: var(--accent);
      background: linear-gradient(135deg, rgba(233, 30, 140, 0.15) 0%, rgba(233, 30, 140, 0.08) 100%);
      border-color: rgba(233, 30, 140, 0.25);
      font-weight: 600;
    }

    .nav a.active::before {
      height: 24px;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      margin-left: 280px;
      padding: var(--spacing-2xl) var(--spacing-3xl);
      background: var(--primary-dark);
      overflow-y: auto;
    }

    .main::-webkit-scrollbar {
      width: 8px;
    }

    .main::-webkit-scrollbar-track {
      background: transparent;
    }

    .main::-webkit-scrollbar-thumb {
      background: rgba(224, 230, 242, 0.08);
      border-radius: 4px;
    }

    .main::-webkit-scrollbar-thumb:hover {
      background: rgba(224, 230, 242, 0.15);
    }

    /* ========== WELCOME SECTION ========== */
    .welcome-section {
      margin-bottom: var(--spacing-3xl);
      animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-message {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, rgba(241, 245, 251, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 var(--spacing-md) 0;
      letter-spacing: -0.5px;
    }

    .welcome-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* ========== CARDS ========== */
    .card {
      background: linear-gradient(135deg, rgba(26, 40, 71, 0.4) 0%, rgba(15, 23, 41, 0.2) 100%);
      border: 1px solid var(--border);
      padding: var(--spacing-xl);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 1px 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(233, 30, 140, 0.1) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      border-color: rgba(233, 30, 140, 0.2);
      background: linear-gradient(135deg, rgba(26, 40, 71, 0.5) 0%, rgba(15, 23, 41, 0.3) 100%);
      box-shadow: 0 16px 40px rgba(233, 30, 140, 0.1), 0 8px 24px rgba(0, 0, 0, 0.3), inset 1px 1px 0 rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .card:hover::before {
      opacity: 1;
    }

    /* ========== MANAGEMENT BUTTONS ========== */
    .management-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--spacing-xl);
      margin-bottom: var(--spacing-3xl);
    }

    .management-btn {
      background: linear-gradient(135deg, rgba(233, 30, 140, 0.15) 0%, rgba(233, 30, 140, 0.05) 100%);
      border: 1px solid rgba(233, 30, 140, 0.2);
      border-radius: 12px;
      padding: var(--spacing-2xl);
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-md);
      font-family: inherit;
      text-align: center;
    }

    .management-btn:hover {
      background: linear-gradient(135deg, rgba(233, 30, 140, 0.25) 0%, rgba(233, 30, 140, 0.1) 100%);
      border-color: rgba(233, 30, 140, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(233, 30, 140, 0.15);
    }

    .management-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: rgba(233, 30, 140, 0.1);
      border-radius: 50%;
      margin-bottom: var(--spacing-sm);
    }

    .management-title {
      margin: 0;
      font-size: 18px;
    }

    .management-desc {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ========== PRODUCTS TABLE ========== */
    .products-section {
      margin-top: var(--spacing-3xl);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-primary);
      margin-top: var(--spacing-lg);
    }

    thead {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, rgba(26, 40, 71, 0.6) 0%, rgba(15, 23, 41, 0.4) 100%);
      z-index: 10;
    }

    th {
      padding: var(--spacing-md) var(--spacing-lg);
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    tbody tr {
      transition: all 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(233, 30, 140, 0.05);
    }

    .action-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      margin-right: 4px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .action-btn.delete {
      background: #f87171;
    }

    .action-btn.delete:hover {
      background: #fca5a5;
    }

    /* ========== MODALS ========== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--spacing-2xl);
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xl);
    }

    .modal-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-label {
      display: block;
      margin-bottom: var(--spacing-sm);
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: var(--spacing-md);
      background: rgba(15, 23, 41, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(233, 30, 140, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      gap: var(--spacing-md);
      justify-content: flex-end;
      margin-top: var(--spacing-xl);
    }

    .btn {
      padding: var(--spacing-md) var(--spacing-lg);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-light);
    }

    .btn-secondary {
      background: rgba(15, 23, 41, 0.5);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 41, 0.7);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .management-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -280px;
        width: 280px;
        transition: left 0.3s ease;
        height: 100%;
        z-index: 1000;
      }

      .sidebar.open {
        left: 0;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }

      .main {
        margin-left: 0;
        padding: var(--spacing-xl) var(--spacing-lg);
      }

      .management-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: var(--spacing-lg);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="../images/shopsphere-logo.svg" alt="ShopSphere">
        <h3>ShopSphere</h3>
      </div>
      <nav class="nav">
        <a href="/admin/dashboard">
          <div class="nav-icon">📊</div>
          <span>Dashboard</span>
        </a>
        <a href="/admin/products" class="active">
          <div class="nav-icon">📦</div>
          <span>Products</span>
        </a>
        <a href="/admin/banners">
          <div class="nav-icon">🎨</div>
          <span>Banners</span>
        </a>
        <a href="/admin/orders">
          <div class="nav-icon">🛒</div>
          <span>Orders</span>
        </a>
        <a href="/admin/users">
          <div class="nav-icon">👥</div>
          <span>Users</span>
        </a>
        <a href="/admin/settings">
          <div class="nav-icon">⚙️</div>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      <!-- Welcome Section -->
      <div class="welcome-section">
        <h1 class="welcome-message">Product Management</h1>
        <p class="welcome-subtitle">Manage your product inventory and catalog</p>
      </div>

      <!-- Management Buttons -->
      <div class="management-grid">
        <button class="management-btn" onclick="showAddProductModal()">
          <div class="management-icon">➕</div>
          <h3 class="management-title">Add Product</h3>
          <p class="management-desc">Add new products to your catalog</p>
        </button>

        <button class="management-btn" onclick="showManageProducts()">
          <div class="management-icon">📋</div>
          <h3 class="management-title">Manage Products</h3>
          <p class="management-desc">View and organize all products</p>
        </button>

        <button class="management-btn" onclick="showEditProducts()">
          <div class="management-icon">✏️</div>
          <h3 class="management-title">Edit Products</h3>
          <p class="management-desc">Modify existing product details</p>
        </button>

        <button class="management-btn" onclick="showRemoveProducts()">
          <div class="management-icon">🗑️</div>
          <h3 class="management-title">Remove Products</h3>
          <p class="management-desc">Delete products from catalog</p>
        </button>
      </div>

      <!-- Products Table -->
      <div class="products-section" id="products-section" style="display: none;">
        <div class="card">
          <h3 style="margin: 0 0 var(--spacing-lg) 0; font-size: 16px; font-weight: 600;">All Products</h3>
          <div id="loading" class="loading" style="text-align: center; padding: var(--spacing-2xl); color: var(--text-muted);">Loading products...</div>
          <table id="products-table" style="display: none;">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Product Modal -->
  <div class="modal" id="add-product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Add New Product</h2>
        <button class="close-btn" onclick="closeModal('add-product-modal')">&times;</button>
      </div>
      <form id="add-product-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="product-name">Product Name</label>
          <input type="text" id="product-name" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-price">Price (Rs.)</label>
          <input type="number" id="product-price" name="price" class="form-input" step="0.01" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-category">Category</label>
          <input type="text" id="product-category" name="category" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-stock">Stock Quantity</label>
          <input type="number" id="product-stock" name="stock" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-description">Description</label>
          <textarea id="product-description" name="description" class="form-input form-textarea" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-image">Image URL</label>
          <input type="text" id="product-image" name="img" class="form-input" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-product-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div class="modal" id="edit-product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Edit Product</h2>
        <button class="close-btn" onclick="closeModal('edit-product-modal')">&times;</button>
      </div>
      <form id="edit-product-form" novalidate>
        <input type="hidden" id="edit-product-id" name="id">
        <div class="form-group">
          <label class="form-label" for="edit-product-name">Product Name</label>
          <input type="text" id="edit-product-name" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-product-price">Price (Rs.)</label>
          <input type="number" id="edit-product-price" name="price" class="form-input" step="0.01" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-product-category">Category</label>
          <input type="text" id="edit-product-category" name="category" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-product-stock">Stock Quantity</label>
          <input type="number" id="edit-product-stock" name="stock" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-product-description">Description</label>
          <textarea id="edit-product-description" name="description" class="form-input form-textarea" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-product-image">Image URL</label>
          <input type="text" id="edit-product-image" name="img" class="form-input" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('edit-product-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Product</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Modal functions
    function showAddProductModal() {
      document.getElementById('add-product-modal').style.display = 'block';
    }

    function showManageProducts() {
      document.getElementById('products-section').style.display = 'block';
      loadProducts();
    }

    function showEditProducts() {
      document.getElementById('products-section').style.display = 'block';
      loadProducts();
      alert('Click the "Edit" button next to any product to modify it.');
    }

    function showRemoveProducts() {
      document.getElementById('products-section').style.display = 'block';
      loadProducts();
      alert('Click the "Delete" button next to any product to remove it.');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    }

    // Load products
    async function loadProducts() {
      try {
        const res = await fetch('/admin/all-products', { credentials: 'include' });
        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();
        renderProducts(data.products || []);
      } catch (e) {
        console.error('Error:', e);
        document.getElementById('loading').textContent = 'Error: ' + e.message + ' (Check browser console for details)';
      }
    }

    function renderProducts(products) {
      const tbody = document.getElementById('products-body');
      tbody.innerHTML = '';

      if (products.length === 0) {
        document.getElementById('loading').textContent = 'No products found.';
        return;
      }

      products.forEach(product => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${product.id}</td>
          <td>${product.name}</td>
          <td>${product.category}</td>
          <td>Rs.${(Number(product.price) || 0).toFixed(2)}</td>
          <td>${product.stock}</td>
          <td>
            <button class="action-btn" onclick="editProduct(${product.id})">Edit</button>
            <button class="action-btn delete" onclick="deleteProduct(${product.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('products-table').style.display = 'table';
    }

    // Add product
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const productData = Object.fromEntries(formData);

      // Basic validation
      if (!productData.name || !productData.price || !productData.category ||
          productData.stock === '' || !productData.description || !productData.img) {
        alert('Please fill in all required fields.');
        return;
      }

      try {
        const res = await fetch('/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(productData)
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }

        alert('Product added successfully!');
        closeModal('add-product-modal');
        e.target.reset();

        // Reload products if table is visible
        if (document.getElementById('products-section').style.display !== 'none') {
          loadProducts();
        }
      } catch (e) {
        console.error('Error:', e);
        alert('Error adding product: ' + e.message);
      }
    });

    // Edit product
    function editProduct(productId) {
      // Find product data and populate edit form
      fetch(`/admin/product/${productId}`, { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          document.getElementById('edit-product-id').value = data.id;
          document.getElementById('edit-product-name').value = data.name;
          document.getElementById('edit-product-price').value = data.price;
          document.getElementById('edit-product-category').value = data.category;
          document.getElementById('edit-product-stock').value = data.stock;
          document.getElementById('edit-product-description').value = data.description;
          document.getElementById('edit-product-image').value = data.img;
          document.getElementById('edit-product-modal').style.display = 'block';
        })
        .catch(e => {
          console.error('Error:', e);
          alert('Error loading product: ' + e.message);
        });
    }

    // Update product
    document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const productData = Object.fromEntries(formData);
      const productId = productData.id;

      // Basic validation
      if (!productData.name || !productData.price || !productData.category ||
          productData.stock === '' || !productData.description || !productData.img) {
        alert('Please fill in all required fields.');
        return;
      }

      try {
        const res = await fetch(`/admin/products/${productId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(productData)
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }

        alert('Product updated successfully!');
        closeModal('edit-product-modal');
        loadProducts();
      } catch (e) {
        console.error('Error:', e);
        alert('Error updating product: ' + e.message);
      }
    });

    // Delete product
    function deleteProduct(productId) {
      if (!confirm('Are you sure you want to delete this product? This action cannot be undone.')) {
        return;
      }

      fetch(`/admin/products/${productId}`, {
        method: 'DELETE',
        credentials: 'include'
      })
      .then(res => {
        if (!res.ok) {
          const errorData = res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }
        alert('Product deleted successfully!');
        loadProducts();
      })
      .catch(e => {
        console.error('Error:', e);
        alert('Error deleting product: ' + e.message);
      });
    }
  </script>
</body>
</html>
