<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --primary-dark: #0a0f1f;
      --secondary-dark: #0f1729;
      --card-dark: #1a2847;
      --accent: #E91E8C;
      --accent-light: #FF4DB8;
      --text-primary: #f1f5fb;
      --text-secondary: #b0b9c8;
      --text-muted: #8a92a1;
      --border: rgba(224, 230, 242, 0.1);
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --spacing-2xl: 28px;
      --spacing-3xl: 36px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto;
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--primary-dark) 0%, #0d1425 50%, #0a0f1f 100%);
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
      background: var(--primary-dark);
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--secondary-dark) 0%, var(--primary-dark) 100%);
      border-right: 1px solid var(--border);
      padding: var(--spacing-2xl) var(--spacing-lg);
      position: fixed;
      height: 100%;
      left: 0;
      top: 0;
      z-index: 100;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-3xl);
      padding-bottom: var(--spacing-lg);
      border-bottom: 1px solid var(--border);
    }

    .logo img {
      width: 40px;
      height: 40px;
    }

    .logo h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-light) 100%);
      border-radius: 0 3px 3px 0;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav a:hover {
      color: var(--text-primary);
      background: rgba(233, 30, 140, 0.08);
      border-color: rgba(233, 30, 140, 0.15);
    }

    .nav a:hover::before {
      height: 24px;
    }

    .nav a.active {
      color: var(--accent);
      background: linear-gradient(135deg, rgba(233, 30, 140, 0.15) 0%, rgba(233, 30, 140, 0.08) 100%);
      border-color: rgba(233, 30, 140, 0.25);
      font-weight: 600;
    }

    .nav a.active::before {
      height: 24px;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      margin-left: 280px;
      padding: var(--spacing-2xl) var(--spacing-3xl);
      background: var(--primary-dark);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .main::-webkit-scrollbar {
      width: 8px;
    }

    .main::-webkit-scrollbar-track {
      background: transparent;
    }

    .main::-webkit-scrollbar-thumb {
      background: rgba(224, 230, 242, 0.08);
      border-radius: 4px;
    }

    .main::-webkit-scrollbar-thumb:hover {
      background: rgba(224, 230, 242, 0.15);
    }

    /* ========== FORM CONTAINER ========== */
    .form-container {
      background: linear-gradient(135deg, rgba(26, 40, 71, 0.4) 0%, rgba(15, 23, 41, 0.2) 100%);
      border: 1px solid var(--border);
      padding: var(--spacing-3xl);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3), inset 1px 1px 0 rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 600px;
      animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-header {
      text-align: center;
      margin-bottom: var(--spacing-2xl);
    }

    .form-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, rgba(241, 245, 251, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 var(--spacing-md) 0;
      letter-spacing: -0.5px;
    }

    .form-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      margin: 0;
    }

    .form-group {
      margin-bottom: var(--spacing-xl);
    }

    .form-label {
      display: block;
      margin-bottom: var(--spacing-sm);
      font-weight: 500;
      color: var(--text-primary);
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: var(--spacing-md) var(--spacing-lg);
      background: rgba(15, 23, 41, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.1);
      background: rgba(15, 23, 41, 0.7);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      margin-top: var(--spacing-2xl);
      flex-wrap: wrap;
    }

    .btn {
      padding: var(--spacing-md) var(--spacing-xl);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
      font-size: 14px;
      min-width: 120px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(233, 30, 140, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, #FF6BC9 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233, 30, 140, 0.4);
    }

    .btn-secondary {
      background: rgba(15, 23, 41, 0.5);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 41, 0.7);
      border-color: rgba(224, 230, 242, 0.2);
      transform: translateY(-1px);
    }

    /* ========== SUCCESS MESSAGE ========== */
    .success-message {
      display: none;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 8px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
      color: #10b981;
      font-weight: 500;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -280px;
        width: 280px;
        transition: left 0.3s ease;
        height: 100%;
        z-index: 1000;
      }

      .sidebar.open {
        left: 0;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }

      .main {
        margin-left: 0;
        padding: var(--spacing-xl) var(--spacing-lg);
      }

      .form-container {
        padding: var(--spacing-2xl);
        margin: var(--spacing-lg);
      }

      .form-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="../images/shopsphere-logo.svg" alt="ShopSphere">
        <h3>ShopSphere</h3>
      </div>
      <nav class="nav">
        <a href="/admin/dashboard">
          <div class="nav-icon">📊</div>
          <span>Dashboard</span>
        </a>
        <a href="/admin/products">
          <div class="nav-icon">📦</div>
          <span>Products</span>
        </a>
        <a href="/admin/banners">
          <div class="nav-icon">🎨</div>
          <span>Banners</span>
        </a>
        <a href="/admin/orders">
          <div class="nav-icon">🛒</div>
          <span>Orders</span>
        </a>
        <a href="/admin/users">
          <div class="nav-icon">👥</div>
          <span>Users</span>
        </a>
        <a href="/admin/settings">
          <div class="nav-icon">⚙️</div>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      <div class="form-container">
        <div class="form-header">
          <h1 class="form-title">Add New Product</h1>
          <p class="form-subtitle">Fill in the details below to add a new product to your catalog</p>
        </div>

        <div id="success-message" class="success-message">
          ✅ Product added successfully! Redirecting...
        </div>

        <form id="add-product-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="product-name">Product Name *</label>
            <input type="text" id="product-name" name="name" class="form-input" placeholder="Enter product name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="product-price">Price (Rs.) *</label>
            <input type="number" id="product-price" name="price" class="form-input" placeholder="0.00" step="0.01" min="0" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="product-category">Category *</label>
            <input type="text" id="product-category" name="category" class="form-input" placeholder="e.g., Skincare, Makeup" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="product-stock">Stock Quantity *</label>
            <input type="number" id="product-stock" name="stock" class="form-input" placeholder="0" min="0" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="product-description">Description *</label>
            <textarea id="product-description" name="description" class="form-input form-textarea" placeholder="Describe your product..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="product-image">Image URL *</label>
            <input type="text" id="product-image" name="img" class="form-input" placeholder="https://example.com/image.jpg" required>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="goBack()">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Product</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Add product
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const productData = Object.fromEntries(formData);

      // Basic validation
      if (!productData.name || !productData.price || !productData.category ||
          productData.stock === '' || !productData.description || !productData.img) {
        alert('Please fill in all required fields.');
        return;
      }

      // Validate price and stock
      if (parseFloat(productData.price) <= 0) {
        alert('Price must be greater than 0.');
        return;
      }

      if (parseInt(productData.stock) < 0) {
        alert('Stock quantity cannot be negative.');
        return;
      }

      try {
        const res = await fetch('/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(productData)
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }

        // Show success message
        const successMsg = document.getElementById('success-message');
        successMsg.style.display = 'block';

        // Reset form
        e.target.reset();

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = '/admin/products';
        }, 2000);

      } catch (e) {
        console.error('Error:', e);
        alert('Error adding product: ' + e.message);
      }
    });

    // Go back function
    function goBack() {
      window.location.href = '/admin/dashboard';
    }

    // Mobile sidebar toggle (if needed)
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
