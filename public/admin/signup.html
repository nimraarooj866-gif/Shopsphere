<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Signup - Shopsphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../auth.css" />
  <style>
    header {
      width: 100%;
      background: linear-gradient(135deg, #C84771, #a83a5a);
      padding: 12px 20px;
      box-shadow: 
        0 8px 16px rgba(200, 71, 113, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      border: none;
      border-radius: 0 0 20px 20px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .header-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
    }
    .header-brand {
      font-size: 18px;
      color: #fff;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    .inner h1 {
      font-size: 30px;
      color: #fff;
      margin: 0 0 4px 0;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 2px;
    }
    .inner nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      opacity: 0.9;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
    }
    .inner nav a:hover {
      opacity: 0.6;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-link {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .header-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .admin-badge {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

  </style>
</head>
<body>
  <header role="banner">
    <div class="header-left">
      <img src="../images/shopsphere-logo.svg" alt="Logo" class="header-logo" style="width:60px; height:auto;">
      <span class="admin-badge">Admin</span>
    </div>
    <div class="inner">
      <h1>Admin Panel</h1>
    </div>
    <div class="header-right">
      <a href="/admin" class="header-link">Login</a>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-box">
      <h2>Signup</h2>
      <form id="admin-signup-form">
        <label for="signup-name">Name (optional)</label>
        <input type="text" id="signup-name" placeholder="Enter your name">

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="Enter your admin email" required>

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Choose a strong password" required>

        <button type="submit">Create Admin</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('admin-signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const res = await fetch('/admin/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location = '/admin/dashboard';
      } else {
        alert(data.message || 'Signup failed');
      }
    });
  </script>
</body>
</html>
