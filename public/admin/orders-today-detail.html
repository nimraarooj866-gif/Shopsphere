<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Orders - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --primary-dark: #0a0f1f;
      --secondary-dark: #0f1729;
      --card-dark: #1a2847;
      --accent: #E91E8C;
      --accent-light: #FF4DB8;
      --text-primary: #f1f5fb;
      --text-secondary: #b0b9c8;
      --text-muted: #8a92a1;
      --border: rgba(224, 230, 242, 0.1);
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --spacing-2xl: 28px;
      --spacing-3xl: 36px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'Poppins', system-ui; color: var(--text-primary); background: linear-gradient(135deg, var(--primary-dark) 0%, #0d1425 50%, #0a0f1f 100%); }
    .app { display: flex; min-height: 100vh; background: var(--primary-dark); }
    .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, rgba(15, 23, 41, 0.95) 0%, rgba(10, 15, 31, 0.98) 100%); border-right: 1px solid var(--border); padding: var(--spacing-xl) var(--spacing-lg); overflow-y: auto; z-index: 100; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(224, 230, 242, 0.1); border-radius: 3px; }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: var(--spacing-2xl); padding-bottom: var(--spacing-xl); border-bottom: 1px solid var(--border); }
    .logo img { width: 48px; height: 48px; border-radius: 8px; }
    .logo h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .nav { display: flex; flex-direction: column; gap: 8px; }
    .nav a { color: var(--text-secondary); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.3s ease; }
    .nav a:hover { color: var(--text-primary); background: rgba(233, 30, 140, 0.08); }
    .main { margin-left: 280px; padding: var(--spacing-3xl); flex: 1; overflow-y: auto; height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .main::-webkit-scrollbar { width: 8px; }
    .main::-webkit-scrollbar-thumb { background: rgba(224, 230, 242, 0.08); border-radius: 4px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-2xl); width: 100%; max-width: 1200px; }
    .header h1 { margin: 0; font-size: 28px; font-weight: 700; }
    .back-btn { background: linear-gradient(135deg, rgba(233, 30, 140, 0.15) 0%, rgba(233, 30, 140, 0.05) 100%); border: 1px solid rgba(233, 30, 140, 0.2); color: var(--accent); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
    .back-btn:hover { background: linear-gradient(135deg, rgba(233, 30, 140, 0.25) 0%, rgba(233, 30, 140, 0.1) 100%); transform: translateY(-2px); }
    .card { background: linear-gradient(135deg, rgba(26, 40, 71, 0.4) 0%, rgba(15, 23, 41, 0.2) 100%); border: 1px solid var(--border); padding: var(--spacing-xl); border-radius: 12px; width: 100%; max-width: 1200px; }
    table { width: 100%; border-collapse: collapse; margin-top: var(--spacing-lg); }
    thead { background: rgba(233, 30, 140, 0.08); }
    th { padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    tbody tr { cursor: pointer; transition: background 0.2s ease; }
    tbody tr:hover { background: rgba(233, 30, 140, 0.05); }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
    .status-badge.pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .status-badge.shipped { background: rgba(59, 130, 246, 0.2); color: var(--info); }
    .status-badge.delivered { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .loading { text-align: center; padding: var(--spacing-2xl); color: var(--text-muted); }
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .sidebar .logo h3, .nav a span { display: none; }
      .main { margin-left: 70px; padding: var(--spacing-lg); }
      .header { flex-direction: column; gap: var(--spacing-lg); }
      th, td { padding: 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="../images/shopsphere-logo.svg" alt="ShopSphere">
        <h3>ShopSphere</h3>
      </div>
      <nav class="nav">
        <a href="/admin/dashboard">
          <div class="nav-icon">📊</div>
          <span>Dashboard</span>
        </a>
        <a href="/admin/products">
          <div class="nav-icon">📦</div>
          <span>Products</span>
        </a>
        <a href="/admin/banners">
          <div class="nav-icon">🎨</div>
          <span>Banners</span>
        </a>
        <a href="/admin/orders">
          <div class="nav-icon">🛒</div>
          <span>Orders</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      <div class="header">
        <h1>📦 Today's Orders</h1>
        <button class="back-btn" onclick="window.location.href='/admin/dashboard'">← Back to Dashboard</button>
      </div>

      <div class="card">
        <h3 style="margin: 0 0 var(--spacing-lg) 0;">Orders Placed Today</h3>
        <div id="loading" class="loading">Loading today's orders...</div>
        <table id="orders-table" style="display: none;">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    async function loadTodayOrders() {
      try {
        const res = await fetch('/admin/today-orders', { credentials: 'include' });
        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'Unknown error' }));
          throw new Error(errorData.message || `HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();
        renderOrders(data.orders || []);
      } catch (e) {
        console.error('Error:', e);
        document.getElementById('loading').textContent = 'Error: ' + e.message + ' (Check browser console for details)';
      }
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('orders-body');
      tbody.innerHTML = '';
      
      if (orders.length === 0) {
        document.getElementById('loading').textContent = 'No orders placed today.';
        return;
      }

      orders.forEach(order => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${order.id}</td>
          <td>${order.customer || '—'}</td>
          <td>Rs.${(Number(order.total) || 0).toFixed(2)}</td>
          <td><span class="status-badge ${(order.status || 'pending').toLowerCase()}">${order.status || 'Pending'}</span></td>
          <td>${order.time || '—'}</td>
        `;
        tr.addEventListener('click', () => {
          window.location.href = `/admin/order-detail/${order.id}`;
        });
        tbody.appendChild(tr);
      });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('orders-table').style.display = 'table';
    }

    loadTodayOrders();
  </script>
</body>
</html>
